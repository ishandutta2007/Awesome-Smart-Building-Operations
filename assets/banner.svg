<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <style>
      @keyframes flowLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glowNode {
        0%, 100% { r: 6px; fill: #34D399; filter: drop-shadow(0 0 4px #34D399); }
        50% { r: 9px; fill: #38BDF8; filter: drop-shadow(0 0 12px #38BDF8); }
      }
      @keyframes floatBuilding {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .node { animation: glowNode 3s infinite ease-in-out; }
      .flow-path { stroke-dasharray: 12, 12; animation: flowLine 4s linear infinite; }
      .building-group { animation: floatBuilding 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>
  <rect width="1196" height="396" x="2" y="2" fill="none" stroke="#1E293B" stroke-width="2" rx="14"/>

  <!-- Grid overlay -->
  <path d="M 0 50 H 1200 M 0 100 H 1200 M 0 150 H 1200 M 0 200 H 1200 M 0 250 H 1200 M 0 300 H 1200 M 0 350 H 1200" stroke="#1E293B" stroke-width="1" opacity="0.3"/>
  <path d="M 100 0 V 400 M 200 0 V 400 M 300 0 V 400 M 400 0 V 400 M 500 0 V 400 M 600 0 V 400 M 700 0 V 400 M 800 0 V 400 M 900 0 V 400 M 1000 0 V 400 M 1100 0 V 400" stroke="#1E293B" stroke-width="1" opacity="0.3"/>

  <!-- Dynamic Telemetry Lines -->
  <path d="M 80 320 Q 250 180 450 260 T 850 140 T 1120 220" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.4"/>
  <path class="flow-path" d="M 80 320 Q 250 180 450 260 T 850 140 T 1120 220" fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- Animated Sensor Nodes -->
  <circle cx="250" cy="225" class="node" style="animation-delay: 0s;"/>
  <circle cx="450" cy="260" class="node" style="animation-delay: 0.8s;"/>
  <circle cx="650" cy="120" class="node" style="animation-delay: 1.5s;"/>
  <circle cx="850" cy="140" class="node" style="animation-delay: 2.1s;"/>
  <circle cx="1080" cy="220" class="node" style="animation-delay: 2.7s;"/>

  <!-- Smart Building Icon / Isometric Tower Graphics -->
  <g class="building-group" transform="translate(930, 90)">
    <polygon points="120,40 180,70 180,210 120,180" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.9"/>
    <polygon points="120,40 60,70 60,210 120,180" fill="#1E293B" stroke="#34D399" stroke-width="2" opacity="0.9"/>
    <polygon points="120,40 180,70 120,100 60,70" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
    
    <line x1="80" y1="90" x2="100" y2="100" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <line x1="80" y1="120" x2="100" y2="130" stroke="#34D399" stroke-width="2" opacity="0.8"/>
    <line x1="80" y1="150" x2="100" y2="160" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>

    <line x1="140" y1="100" x2="160" y2="90" stroke="#34D399" stroke-width="2" opacity="0.8"/>
    <line x1="140" y1="130" x2="160" y2="120" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <line x1="140" y1="160" x2="160" y2="150" stroke="#34D399" stroke-width="2" opacity="0.8"/>

    <line x1="120" y1="40" x2="120" y2="10" stroke="#10B981" stroke-width="3"/>
    <circle cx="120" cy="10" r="4" fill="#34D399"/>
    <circle cx="120" cy="10" r="12" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="4;22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title & Branding -->
  <text x="80" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="url(#text-grad)" letter-spacing="0.5">
    Awesome Smart Building Operations
  </text>
  
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94A3B8" letter-spacing="0.5">
    🏢 Building Operations • ⚡ Energy Management • ❄️ HVAC • 📡 IoT • 🔮 Digital Twins
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="145" height="36" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="72" y="23" font-family="sans-serif" font-weight="600" font-size="14" fill="#34D399" text-anchor="middle">SaaS Platforms</text>

    <rect x="160" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="240" y="23" font-family="sans-serif" font-weight="600" font-size="14" fill="#38BDF8" text-anchor="middle">Open-Source BEMS</text>

    <rect x="335" y="0" width="145" height="36" rx="18" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="407" y="23" font-family="sans-serif" font-weight="600" font-size="14" fill="#C084FC" text-anchor="middle">IoT &amp; BACnet</text>

    <rect x="495" y="0" width="155" height="36" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="572" y="23" font-family="sans-serif" font-weight="600" font-size="14" fill="#FBBF24" text-anchor="middle">AI &amp; FDD Analytics</text>
  </g>

  <!-- Footer Stats / Status -->
  <text x="80" y="320" font-family="monospace" font-weight="600" font-size="14" fill="#64748B">
    STATUS: <tspan fill="#34D399">ACTIVE MONITORING</tspan> | PROTOCOLS: <tspan fill="#38BDF8">BACnet, Modbus, MQTT, OPC UA</tspan>
  </text>
</svg>